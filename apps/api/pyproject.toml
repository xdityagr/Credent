[project]
name = "credent"
version = "0.1.0"
description = "Credent: private credit, public book"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.4",
    "pynacl>=1.5",
    "base58>=2.1",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.9",
    "solders>=0.23",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6.100", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["credent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["prover: requires the credent-prover docker image"]
addopts = "-m 'not prover'"
